name: budget

services:
  edge:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    depends_on:
      - web
      - budget-server
    environment:
      SITE_HOSTS: ${SITE_HOSTS:-localhost 127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - frontend
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    image: ghcr.io/carson-networks/budget:v0.8.0@sha256:82f5d92cdc7226e5c40bf3bafcb7351b6eee5ed8b9cefb2ad65a9bdf26d48f07
    restart: unless-stopped
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  budget-server:
    image: ghcr.io/carson-networks/budget-server:v0.19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_ADDRESS: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?set PLAID_CLIENT_ID in .env}
      PLAID_SECRET: ${PLAID_SECRET:?set PLAID_SECRET in .env}
      PLAID_ENVIRONMENT: ${PLAID_ENVIRONMENT:-sandbox}
    # default: reachable from edge and gives Plaid egress.
    networks:
      - default
      - db
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
    internal: true
  db:
    internal: true

volumes:
  postgres-data:
