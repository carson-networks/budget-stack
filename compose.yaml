name: budget

# Settings shared by the released and locally built services.
x-web: &web
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /data
    - /config
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-budget-server: &budget-server
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    POSTGRES_ADDRESS: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: postgres
    POSTGRES_USERNAME: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?set PLAID_CLIENT_ID in .env}
    PLAID_SECRET: ${PLAID_SECRET:?set PLAID_SECRET in .env}
    PLAID_ENVIRONMENT: ${PLAID_ENVIRONMENT:-sandbox}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  edge:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      SITE_HOSTS: ${SITE_HOSTS:-localhost 127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - frontend
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Pinned releases: `make start`.
  web:
    <<: *web
    image: ghcr.io/carson-networks/budget:v0.3.0@sha256:6659a82d6b0b5f8984fe948112ca9b3eb02d295aa6607056239f3efb2368f18b
    profiles: [release]
    networks:
      - frontend

  budget-server:
    <<: *budget-server
    image: ghcr.io/carson-networks/budget-server:v0.19.0@sha256:ddf7ca3dc4b183de31e4b8cc979dab590283d2550d3f0eb1752f947d4a5d8ca6
    profiles: [release]
    # default: reachable from edge and gives Plaid egress.
    networks:
      - default
      - db

  # Built from the sibling checkouts: `make start-local`. The aliases let edge reach them by the same names.
  web-local:
    <<: *web
    build: ../budget
    image: budget-web:local
    profiles: [local]
    networks:
      frontend:
        aliases: [web]

  budget-server-local:
    <<: *budget-server
    build: ../budget-server
    image: budget-server:local
    profiles: [local]
    networks:
      default:
        aliases: [budget-server]
      db: {}

  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
    internal: true
  db:
    internal: true

volumes:
  postgres-data:
