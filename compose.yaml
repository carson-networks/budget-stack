name: budget

# Settings shared by the released and locally built services.
x-web: &web
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /data
    - /config
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-budget-server: &budget-server
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    POSTGRES_ADDRESS: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: postgres
    POSTGRES_USERNAME: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?set PLAID_CLIENT_ID in .env}
    PLAID_SECRET: ${PLAID_SECRET:?set PLAID_SECRET in .env}
    PLAID_ENVIRONMENT: ${PLAID_ENVIRONMENT:-sandbox}
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  edge:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      SITE_HOSTS: ${SITE_HOSTS:-localhost 127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - frontend
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Pinned releases: `make start`.
  web:
    <<: *web
    image: ghcr.io/carson-networks/budget:v0.25.0@sha256:7d07afe4102d2b1c5fee5688537f775c56653fd328f81953d05f86034a7d7d69
    profiles: [release]
    networks:
      - frontend

  budget-server:
    <<: *budget-server
    image: ghcr.io/carson-networks/budget-server:v0.19.0
    profiles: [release]
    # default: reachable from edge and gives Plaid egress.
    networks:
      - default
      - db

  # Built from the sibling checkouts: `make start-local`. The aliases let edge reach them by the same names.
  web-local:
    <<: *web
    build: ../budget
    image: budget-web:local
    profiles: [local]
    networks:
      frontend:
        aliases: [web]

  budget-server-local:
    <<: *budget-server
    build: ../budget-server
    image: budget-server:local
    profiles: [local]
    networks:
      default:
        aliases: [budget-server]
      db: {}

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontend:
    internal: true
  db:
    internal: true

volumes:
  postgres-data:
