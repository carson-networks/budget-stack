name: budget

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  budget-server:
    image: ghcr.io/carson-networks/budget-server:v0.18.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_ADDRESS: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:?set PLAID_CLIENT_ID in .env}
      PLAID_SECRET: ${PLAID_SECRET:?set PLAID_SECRET in .env}
      PLAID_ENVIRONMENT: ${PLAID_ENVIRONMENT:-sandbox}
    # Not published: only reachable through the web proxy. default gives Plaid egress.
    networks:
      - db
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    image: ghcr.io/carson-networks/budget:v0.3.0
    restart: unless-stopped
    depends_on:
      - budget-server
    environment:
      API_UPSTREAM: http://budget-server:9447
      SITE_HOSTS: ${SITE_HOSTS:-localhost 127.0.0.1}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  db:
    internal: true

volumes:
  postgres-data:
